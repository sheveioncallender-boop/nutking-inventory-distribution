<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="The Nut Kings">
  <defs>
    <linearGradient id="redInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ed1c24"/>
      <stop offset="1" stop-color="#c90f18"/>
    </linearGradient>
    <linearGradient id="blackInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <pattern id="ribRed" width="13" height="13" patternUnits="userSpaceOnUse">
      <rect width="13" height="13" fill="url(#redInk)"/>
      <path d="M2 0v13M6 0v13M10 0v13" stroke="#810c12" stroke-width="1.8" opacity=".43"/>
      <path d="M4 0v13M8 0v13M12 0v13" stroke="#ff565c" stroke-width=".75" opacity=".35"/>
    </pattern>
    <pattern id="ribBlack" width="13" height="13" patternUnits="userSpaceOnUse">
      <rect width="13" height="13" fill="url(#blackInk)"/>
      <path d="M2 0v13M6 0v13M10 0v13" stroke="#000" stroke-width="2" opacity=".8"/>
      <path d="M4 0v13M8 0v13M12 0v13" stroke="#4b4b4b" stroke-width=".7" opacity=".32"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="8" dy="10" stdDeviation="2" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>

  <!-- vertical THE -->
  <g font-family="DejaVu Sans,Arial,sans-serif" font-weight="1000" font-size="94" text-anchor="middle" fill="url(#ribRed)" stroke="#a70c13" stroke-width="2">
    <text x="72" y="114">T</text>
    <text x="72" y="207">H</text>
    <text x="72" y="300">E</text>
  </g>

  <!-- upper word NUT -->
  <g font-family="DejaVu Sans Condensed,Arial Narrow,Arial,sans-serif" font-weight="1000" font-stretch="condensed" filter="url(#shadow)">
    <text x="128" y="232" font-size="254" letter-spacing="-22" fill="url(#ribBlack)" stroke="#000" stroke-width="3">N</text>
    <text x="332" y="232" font-size="254" letter-spacing="-22" fill="url(#ribRed)" stroke="#7e090f" stroke-width="3">U</text>
    <text x="557" y="232" font-size="254" letter-spacing="-22" fill="url(#ribRed)" stroke="#7e090f" stroke-width="3">T</text>
  </g>

  <!-- dark cap/shadow across the U, matching the original split-colour treatment -->
  <path d="M353 60h188l-17 78H369z" fill="url(#ribBlack)" opacity=".96"/>

  <!-- royal crown integrated above the T -->
  <g transform="translate(552 0) rotate(8 154 99)" filter="url(#shadow)">
    <path d="M24 140 6 63l72 40 43-86 45 82 83-47-26 92z" fill="url(#ribRed)" stroke="#7e090f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M28 142h194l-9 34H39z" fill="#ef1b23" stroke="#7e090f" stroke-width="5"/>
    <circle cx="6" cy="57" r="17" fill="#f8be28" stroke="#c98a00" stroke-width="4"/>
    <circle cx="121" cy="15" r="17" fill="#f8be28" stroke="#c98a00" stroke-width="4"/>
    <circle cx="251" cy="47" r="17" fill="#f8be28" stroke="#c98a00" stroke-width="4"/>
  </g>

  <!-- lower word KINGS -->
  <text x="116" y="433" font-family="DejaVu Sans Condensed,Arial Narrow,Arial,sans-serif" font-weight="1000" font-stretch="condensed" font-size="244" letter-spacing="-19" fill="url(#ribRed)" stroke="#7e090f" stroke-width="3" filter="url(#shadow)">KINGS</text>
</svg>
